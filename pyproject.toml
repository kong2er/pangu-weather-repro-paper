[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pangu-weather-repro"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "cdsapi>=0.7",
  "requests>=2.31",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "cartopy>=0.22",
  "onnx>=1.16",
  "onnxruntime>=1.16",
  "huggingface-hub>=1.3.7",
  "pytest>=8.2",
  "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5.0",
]
gpu = [
  "onnxruntime-gpu>=1.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pangu_weather_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"


[tool.uv]
# Lock only for the actual runtime environment.
# NOTE: This uv version expects PEP 508 marker expressions here.
environments = [
  'sys_platform == "linux" and platform_machine == "x86_64" and python_version == "3.10"',
]
