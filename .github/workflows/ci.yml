name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync
      - name: Compile
        run: uv run python -m compileall pangu_weather_repro tools scripts
      - name: Smoke
        run: uv run python -m pangu_weather_repro.smoke
      - name: Tests
        run: uv run pytest -q
      - name: Repo Check
        run: uv run python tools/check_repo_health.py
